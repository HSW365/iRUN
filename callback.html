<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>iRun Connect</title>
<link rel="stylesheet" href="assets/hsw/hsw.css">
<style>:root{--acc:#ef4444}body{display:grid;place-items:center;min-height:100vh;padding:16px}
.c{max-width:560px;width:100%}h1{font-size:clamp(44px,8vw,64px);margin:0 0 12px}
code{display:block;background:var(--card);border:1px solid var(--line2);padding:14px;border-radius:4px;word-break:break-all;color:#fbbf24;margin:14px 0;font-family:var(--mono);font-size:13px}
p{color:var(--text2)}.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--acc);border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px;margin-right:10px}@keyframes s{to{transform:rotate(360deg)}}</style></head>
<body><div class="c">
  <!-- Instagram Business Login: the code is exchanged server side, then you land in the iRun Instagram workspace. -->
  <div id="ig" hidden><h1>Connecting Instagram</h1><p id="ig-m"><span class="spin"></span>Finishing your login. This takes a few seconds.</p><p id="ig-a" hidden><a class="btn btn-acc btn-sm" href="instagram.html">Try again</a></p></div>
  <!-- TikTok (and other) logins: copy the code into the iRun setup window. -->
  <div id="code-box" hidden><h1>iRun Connect</h1><p id="m">Copy this code and paste it into the iRun setup window.</p><code id="code"></code>
  <button class="btn btn-acc btn-sm" onclick="navigator.clipboard.writeText(document.getElementById('code').textContent)">Copy code</button></div>
</div>
<script>
(async () => {
  const API = "https://lsxdlmrjrcivxwgfkpop.supabase.co/functions/v1/irun-ig-auth";
  const q = new URLSearchParams(location.search);
  const code = q.get("code");
  const state = q.get("state") || "";
  const err = q.get("error_description") || q.get("error_reason") || q.get("error");

  if (state.startsWith("ig.")) {
    document.getElementById("ig").hidden = false;
    const fail = (m) => { document.getElementById("ig-m").textContent = m; document.getElementById("ig-a").hidden = false; };
    if (!code) return fail(err ? "Instagram login was cancelled: " + err : "Instagram did not send a login code.");
    try {
      const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ a: "exchange", code, state }) });
      const j = await r.json();
      if (!r.ok || j.error) return fail(j.error || "Instagram login failed.");
      try { localStorage.setItem("irun_ig", JSON.stringify({ u: j.u, s: j.s, username: j.username })); } catch {}
      location.replace("instagram.html?connected=1#overview");
    } catch { fail("Could not reach iRun. Check your connection and try again."); }
    return;
  }

  document.getElementById("code-box").hidden = false;
  document.getElementById("code").textContent = code || ("No code received" + (err ? ": " + err : ""));
  if (!code) document.getElementById("m").textContent = "Connection did not complete.";
})();
</script>
</body></html>
