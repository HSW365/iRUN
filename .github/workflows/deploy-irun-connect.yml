name: Deploy iRun Connect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/irun-connect/**"
      - ".github/workflows/deploy-irun-connect.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy credentials
        id: creds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set, so irun-connect was not redeployed. Add it in Settings > Secrets and variables > Actions, then run this workflow."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Supabase CLI
        if: steps.creds.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy irun-connect
        if: steps.creds.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy irun-connect --project-ref lsxdlmrjrcivxwgfkpop --no-verify-jwt
