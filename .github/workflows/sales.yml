name: HSW365 Sales Autopilot

on:
  schedule:
    # Hourly: answer replies. 14:xx UTC (10am ET) new outreach, 17:xx UTC follow-ups, 00:xx UTC nightly summary.
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths: ["config/salesgo.txt"]  # edit this file to fire a full run (outreach + replies + follow-ups) right away
  workflow_dispatch:
    inputs:
      task:
        description: "auto, outreach, replies, followups, summary or all"
        default: "auto"

permissions:
  contents: read

concurrency:
  group: hsw365-sales
  cancel-in-progress: false

jobs:
  sell:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Run
        env:
          SUPABASE_URL: https://lsxdlmrjrcivxwgfkpop.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          IMAP_HOST: ${{ vars.IMAP_HOST }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OUTREACH_ADDRESS: ${{ vars.OUTREACH_ADDRESS }}
          SALES_DAILY_CAP: ${{ vars.SALES_DAILY_CAP }}
          SALES_MODE: ${{ vars.SALES_MODE }}
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then echo "Add the SUPABASE_SERVICE_KEY repo secret to switch the sales autopilot on."; exit 0; fi
          # Shop Team: top up Shopify store leads before the 14:xx UTC outreach (and on a manual/push run)
          if [ "$(date -u +%H)" = "13" ] || [ "${{ github.event_name }}" != "schedule" ]; then
            python engine/shopify_leads.py --minutes 25 || echo "shop team lead finder failed, outreach continues"
          fi
          python engine/sales.py --task "${{ github.event_name == 'push' && 'all' || github.event.inputs.task || 'auto' }}"
