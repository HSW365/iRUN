name: HSW365 Sales Autopilot

on:
  # Automatic email outreach, follow-ups and replies are paused per owner instruction.
  # Manual workflow_dispatch remains available for a separately approved run.
  workflow_dispatch:
    inputs:
      task:
        description: "auto, outreach, replies, followups, summary or all"
        default: "summary"

permissions:
  contents: read

concurrency:
  group: hsw365-sales
  cancel-in-progress: false

jobs:
  sell:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Run
        env:
          SUPABASE_URL: https://lsxdlmrjrcivxwgfkpop.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          IMAP_HOST: ${{ vars.IMAP_HOST }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OUTREACH_ADDRESS: ${{ vars.OUTREACH_ADDRESS }}
          SALES_DAILY_CAP: "150"
          SALES_MODE: ${{ vars.SALES_MODE }}
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then echo "Sales Autopilot idle: SUPABASE_SERVICE_KEY secret missing"; exit 0; fi
          python engine/sales.py --task "${{ github.event.inputs.task || 'summary' }}"
