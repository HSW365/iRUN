name: iRun Talking Face

# AI face (or your own photo) speaks a script, lip-synced, as a branded 9:16 ad with QR, then posts to Instagram.
# Free and open-source: SadTalker (Apache-2.0) lip-sync on the runner CPU, Kokoro narrator, Pollinations face.
# Commit config/talkingface.json  {"spec": "content/faces/<slug>.json", "post": true, "account": "hoodstar365"}
on:
  push:
    branches: [main]
    paths: ["config/talkingface.json"]
  workflow_dispatch:
    inputs:
      spec: {description: "spec path (content/faces/<slug>.json)", required: true}
      post: {description: "post to Instagram", type: boolean, default: true}

permissions:
  contents: write

concurrency:
  group: irun
  cancel-in-progress: false

jobs:
  face:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SUPABASE_URL: https://lsxdlmrjrcivxwgfkpop.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      IRUN_NARRATOR: kokoro
      IRUN_MODE: ${{ vars.IRUN_MODE || 'live' }}
      IRUN_IMAGE_TRIES: "8"
      SADTALKER_DIR: ${{ github.workspace }}/.sadtalker
      SADTALKER_PY: ${{ github.workspace }}/.stenv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install iRun
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg rubberband-cli
          pip install -q -r requirements.txt kokoro-onnx soundfile
          SPEC_FILE="${{ inputs.spec }}"; [ -n "$SPEC_FILE" ] || SPEC_FILE=$(jq -r .spec config/talkingface.json)
          if [ "$(jq -r '.voice // ""' "$SPEC_FILE")" = "owner" ]; then pip install -q chatterbox-tts faster-whisper; fi
      - name: Install lip-sync engine (SadTalker, CPU)
        run: |
          pip install -q uv && uv python install 3.10
          git clone -q --depth 1 https://github.com/OpenTalker/SadTalker.git .sadtalker
          uv venv -q -p 3.10 .stenv
          VIRTUAL_ENV=.stenv uv pip install -q torch==2.0.1 torchvision==0.15.2 torchaudio==2.0.2 --index-url https://download.pytorch.org/whl/cpu
          VIRTUAL_ENV=.stenv uv pip install -q numpy==1.23.4 face_alignment==1.3.5 imageio==2.19.3 imageio-ffmpeg==0.4.7 \
            librosa==0.9.2 numba resampy==0.3.1 pydub==0.25.1 scipy==1.10.1 kornia==0.6.8 tqdm yacs==0.1.8 pyyaml \
            joblib==1.1.0 scikit-image==0.19.3 basicsr==1.4.2 facexlib==0.3.0 gfpgan av safetensors "setuptools<70"
          VIRTUAL_ENV=.stenv uv pip install -q numpy==1.23.4
      - name: Lip-sync models
        uses: actions/cache@v4
        with: {path: lipsync-models, key: sadtalker-v0.0.2-gfpgan14}
      - name: Narrator model
        uses: actions/cache@v4
        with: {path: assets/voice/models, key: kokoro-v1.0}
      - name: Fetch models
        run: |
          mkdir -p lipsync-models/checkpoints lipsync-models/gfpgan/weights
          R=https://github.com/OpenTalker/SadTalker/releases/download/v0.0.2-rc
          for f in mapping_00109-model.pth.tar mapping_00229-model.pth.tar SadTalker_V0.0.2_256.safetensors; do
            [ -s lipsync-models/checkpoints/$f ] || curl -sSL -o lipsync-models/checkpoints/$f $R/$f; done
          W=lipsync-models/gfpgan/weights
          [ -s $W/alignment_WFLW_4HG.pth ] || curl -sSL -o $W/alignment_WFLW_4HG.pth https://github.com/xinntao/facexlib/releases/download/v0.1.0/alignment_WFLW_4HG.pth
          [ -s $W/detection_Resnet50_Final.pth ] || curl -sSL -o $W/detection_Resnet50_Final.pth https://github.com/xinntao/facexlib/releases/download/v0.1.0/detection_Resnet50_Final.pth
          [ -s $W/GFPGANv1.4.pth ] || curl -sSL -o $W/GFPGANv1.4.pth https://github.com/TencentARC/GFPGAN/releases/download/v1.3.0/GFPGANv1.4.pth
          [ -s $W/parsing_parsenet.pth ] || curl -sSL -o $W/parsing_parsenet.pth https://github.com/xinntao/facexlib/releases/download/v0.2.2/parsing_parsenet.pth
          ln -s "$PWD/lipsync-models/checkpoints" .sadtalker/checkpoints
          mkdir -p .sadtalker/gfpgan && ln -s "$PWD/$W" .sadtalker/gfpgan/weights
          mkdir -p assets/voice/models && (cd assets/voice/models && for f in kokoro-v1.0.onnx voices-v1.0.bin; do [ -s $f ] || curl -sSL -o $f https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f; done)
      - name: Build and post
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SPEC="${{ inputs.spec }}"; POST="${{ inputs.post }}"; ACCOUNT=""
          else
            SPEC=$(jq -r .spec config/talkingface.json); POST=$(jq -r 'if .post == false then "false" else "true" end' config/talkingface.json)
            ACCOUNT=$(jq -r '.account // ""' config/talkingface.json)
          fi
          ARGS=""; [ "$POST" = "true" ] && ARGS="--post"; [ -n "$ACCOUNT" ] && ARGS="$ARGS --account $ACCOUNT"
          python engine/talkingface.py "$SPEC" $ARGS 2>&1 | tee out-face.log; test ${PIPESTATUS[0]} -eq 0
      - name: Keep the ad
        if: always()
        run: |
          mkdir -p assets/ads/built
          cp out/*-face.mp4 out/*-face-face.jpg assets/ads/built/ 2>/dev/null || true
          cp out-face.log assets/ads/built/last-face-build.log 2>/dev/null || true
          git config user.name "iRun"; git config user.email "hsw365media@gmail.com"
          git add assets/ads/built 2>/dev/null || true
          git diff --cached --quiet || git commit -m "iRun talking face [skip ci]"
          git pull -q --rebase origin main && git push -q || true
