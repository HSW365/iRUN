name: iRun post now

# Direct posting hook: commit config/postnow.json and iRun posts that finished video right away.
# {"video": "assets/ads/x.mp4", "caption": "...", "account": "hoodstar365", "platform": "instagram"}
on:
  push:
    branches: [main]
    paths: ["config/postnow.json"]

permissions:
  contents: write

concurrency:
  group: irun
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
      - name: Post
        env:
          SUPABASE_URL: https://lsxdlmrjrcivxwgfkpop.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          IRUN_MODE: ${{ vars.IRUN_MODE || 'live' }}
        run: |
          # "spec" = build the ad with iRun's own engine first (images + free voice), then post it
          SPEC=$(jq -r '.spec // ""' config/postnow.json)
          VIDEO=$(jq -r '.video // ""' config/postnow.json)
          if [ -n "$SPEC" ]; then
            VIDEO="out/$(basename "$SPEC" .json)-ad.mp4"
            mkdir -p out && python engine/make_ad.py "$SPEC" "$VIDEO" 2>&1 | tee out/build.log; test ${PIPESTATUS[0]} -eq 0
          fi
          if [ "$(jq -r '.post // true' config/postnow.json)" = "false" ]; then echo "build only"; exit 0; fi
          CAPTION=$(jq -r '.caption // ""' config/postnow.json)
          ACCOUNT=$(jq -r '.account // "hoodstar365"' config/postnow.json)
          PLATFORM=$(jq -r '.platform // "instagram"' config/postnow.json)
          python engine/run.py --account "$ACCOUNT" --platform "$PLATFORM" --video "$VIDEO" --caption "$CAPTION" 2>&1 | tee -a out/build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Keep the built ad
        if: always()
        run: |
          mkdir -p assets/ads/built
          cp out/*-ad.mp4 assets/ads/built/ 2>/dev/null || true
          cp out/build.log assets/ads/built/last-build.log 2>/dev/null || true
          git config user.name "iRun"; git config user.email "hsw365media@gmail.com"
          git add assets/ads/built
          git diff --cached --quiet && exit 0
          git commit -qm "iRun: built ad [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
